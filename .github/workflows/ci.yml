name: Enterprise Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-audit:
    name: Pre-Flight Security & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Verify GitIgnore Integrity
        run: |
          echo "Verifying gitignore rules..."
          test -f .gitignore || (echo ".gitignore missing!" && exit 1)
          grep -q '\.env\*' .gitignore || (echo ".env* not ignored!" && exit 1)
          grep -q '\*.local.json' .gitignore || (echo "*.local.json not ignored!" && exit 1)
          echo "GitIgnore verification passed."

      - name: Scan for Leaked Secrets
        run: |
          echo "Scanning for sensitive patterns..."
          if grep -rEI "AIzaSy[0-9A-Za-z_-]{33}" --exclude-dir={.git,node_modules,dist,bin,obj} .; then
            echo "ERROR: Google API Key detected!"
            exit 1
          fi
          echo "Zero-leak secret scan passed clean."

  backend-dotnet:
    name: .NET 9 Engine & xUnit Suite
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore backend/AiDocumentWorkflow.Api/AiDocumentWorkflow.Api.csproj

      - name: Build Backend (Token-Lean)
        run: dotnet build backend/AiDocumentWorkflow.Api/AiDocumentWorkflow.Api.csproj --no-restore --nologo -clp:ErrorsOnly

      - name: Run xUnit Security & Workflow Tests
        run: dotnet test backend/AiDocumentWorkflow.Tests/AiDocumentWorkflow.Tests.csproj --nologo -v q

  frontend-angular:
    name: Angular 19 Client Build
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/client/package.json'

      - name: Install Frontend Dependencies
        working-directory: frontend/client
        run: npm ci

      - name: Build Angular Client
        working-directory: frontend/client
        env:
          NG_CLI_ANALYTICS: "false"
        run: npx ng build --base-href /ai-document-workflow/
